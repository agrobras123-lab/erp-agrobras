/* DATE UTILS (melhoria 11 — horário local) */
function localDate(d){d=d||new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd}
function localDateTime(){var d=new Date();return localDate(d)+'_'+String(d.getHours()).padStart(2,'0')+'-'+String(d.getMinutes()).padStart(2,'0')+'-'+String(d.getSeconds()).padStart(2,'0')}
var today=function(){return localDate()};

var toNum=function(v){return parseFloat((v||"").toString().replace(",","."))||0};
var fmt=function(v){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0)};
var fmtD=function(d){return d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—"};
var vtotal=function(v){return(v.pix||0)+(v.dinheiro||0)+(v.fiado||0)+(v.cartao||0)+(v.boleto||0)};
var ctotal=function(c){return(c.pix||0)+(c.dinheiro||0)+(c.aprazo||0)};
var diffDays=function(d){if(!d)return null;var t=new Date(d+"T12:00:00"),n=new Date();n.setHours(12,0,0,0);return Math.round((t-n)/86400000)};
function vencInfo(item){
  if(item.status==="Pago")return{bg:"#DCFCE7",cl:"#14532D",icon:"✅",label:"Pago",ord:99};
  var d=diffDays(item.vencimento);
  if(d===null)return{bg:"#F1F8E9",cl:"#155218",icon:"📅",label:"A Pagar",ord:10};
  if(d<0)return{bg:"#FEE2E2",cl:"#991B1B",icon:"🛑",label:"Vencido "+Math.abs(d)+"d",ord:0};
  if(d===0)return{bg:"#FEE2E2",cl:"#991B1B",icon:"🛑",label:"Vence hoje!",ord:1};
  if(d<=3)return{bg:"#FEF3C7",cl:"#92400E",icon:"🟠",label:"Vence em "+d+"d",ord:2};
  return{bg:"#F1F8E9",cl:"#155218",icon:"📅",label:"em "+d+"d",ord:5};
}
function byPeriod(items,p,s,e,f){
  f=f||"data";var now=new Date();now.setHours(12,0,0,0);
  return items.filter(function(it){
    var raw=it[f];if(!raw)return false;
    var d=new Date(raw+"T12:00:00");if(isNaN(d))return false;
    if(p==="hoje")return d.toDateString()===now.toDateString();
    if(p==="semana"){var dy=now.getDay()||7,mn=new Date(now);mn.setDate(now.getDate()-dy+1);var sn=new Date(mn);sn.setDate(mn.getDate()+6);return d>=mn&&d<=sn}
    if(p==="mes")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(p==="custom"&&s&&e)return d>=new Date(s+"T00:00:00")&&d<=new Date(e+"T23:59:59");
    return true;
  });
}
var mesLabel=function(ym){var pp=ym.split("-");return new Date(+pp[0],+pp[1]-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};
var currentMes=function(){var n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")};
function buildMesesOpts(adts){
  var set=new Set();var now=new Date();
  for(var i=0;i<13;i++){var d=new Date(now.getFullYear(),now.getMonth()-i,1);set.add(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
  adts.forEach(function(a){if(a.data)set.add(a.data.slice(0,7))});
  return Array.from(set).sort(function(a,b){return b.localeCompare(a)});
}

/* FIREBASE */
var FB_KEY="AIzaSyA7MzAgK5OIhY4nWg7vdGHxCz5V-mQSgpI";
var FB_BASE="https://firestore.googleapis.com/v1/projects/erp-agrobras/databases/(default)/documents";
var FB_URL=FB_BASE+"/erp/murilo?key="+FB_KEY;
var OFK="erp_agb_ofk4";
function fbPatch(url,data){return fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{payload:{stringValue:JSON.stringify(data)}}})})}
function saveData(data,onStatus){
  if(onStatus)onStatus('saving');
  if(!navigator.onLine){try{localStorage.setItem(OFK,JSON.stringify(data))}catch(e){}if(onStatus)onStatus('local');return}
  fbPatch(FB_URL,data).then(function(res){
    if(!res.ok)throw new Error("err");
    try{localStorage.removeItem(OFK)}catch(e){}
    if(onStatus)onStatus('cloud');
    var tag='backup_'+localDateTime();
    fbPatch(FB_BASE+'/backups/'+tag+'?key='+FB_KEY,data).catch(function(){});
  }).catch(function(){
    try{localStorage.setItem(OFK,JSON.stringify(data))}catch(e){}
    if(onStatus)onStatus('error');
  });
}
function loadData(){
  return fetch(FB_URL).then(function(r){if(!r.ok)throw new Error("e");return r.json()}).then(function(j){return JSON.parse(j.fields.payload.stringValue)}).catch(function(){try{var p=localStorage.getItem(OFK);if(p)return JSON.parse(p)}catch(e){}return null});
}
window.addEventListener("online",function(){
  try{
    var p=localStorage.getItem(OFK);
    if(!p)return;
    if(window._setSyncStatus)window._setSyncStatus('syncing');
    fbPatch(FB_URL,JSON.parse(p)).then(function(){
      localStorage.removeItem(OFK);
      if(window._setSyncStatus)window._setSyncStatus('synced');
      setTimeout(function(){if(window._setSyncStatus)window._setSyncStatus('idle')},3000);
    }).catch(function(){if(window._setSyncStatus)window._setSyncStatus('error')});
  }catch(e){}
});

/* CHARTS MELHORADOS (melhoria 7) */
function WeekBarChart(p){
  var data=p.data;
  var max=Math.max.apply(Math,data.map(function(d){return Math.max(d.Vendas||0,d.Saidas||0)}).concat([1]));
  var H=100,bW=17,gap=3,gW=bW*2+gap+12,W=data.length*gW+6;
  return ce("svg",{width:"100%",viewBox:"0 0 "+W+" "+(H+36),style:{overflow:"visible"}},
    data.map(function(d,i){
      var x=i*gW+6;
      var hV=Math.max(Math.round((d.Vendas||0)/max*H),0),hS=Math.max(Math.round((d.Saidas||0)/max*H),0);
      var isToday=d.isToday;
      return ce("g",{key:i},
        isToday&&ce("rect",{x:x-4,y:0,width:bW*2+gap+8,height:H+4,rx:6,fill:"#F8FAFC",opacity:.7}),
        hV>0&&ce(R.Fragment,null,
          ce("rect",{x:x,y:H-hV,width:bW,height:hV,fill:"url(#gV)",rx:4}),
          hV>14&&ce("text",{x:x+bW/2,y:H-hV-5,textAnchor:"middle",fontSize:7.5,fill:"#16A34A",fontWeight:"800"},d.Vendas>=1000?(d.Vendas/1000).toFixed(1)+"k":Math.round(d.Vendas))
        ),
        hS>0&&ce(R.Fragment,null,
          ce("rect",{x:x+bW+gap,y:H-hS,width:bW,height:hS,fill:"url(#gS)",rx:4}),
          hS>14&&ce("text",{x:x+bW+gap+bW/2,y:H-hS-5,textAnchor:"middle",fontSize:7.5,fill:"#DC2626",fontWeight:"800"},d.Saidas>=1000?(d.Saidas/1000).toFixed(1)+"k":Math.round(d.Saidas))
        ),
        ce("text",{x:x+bW,y:H+16,textAnchor:"middle",fontSize:9,fill:isToday?"#1B5E20":"#94A3B8",fontWeight:isToday?"800":"400"},d.dia)
      );
    }),
    ce("defs",null,
      ce("linearGradient",{id:"gV",x1:"0",y1:"0",x2:"0",y2:"1"},ce("stop",{offset:"0%",stopColor:"#4ADE80"}),ce("stop",{offset:"100%",stopColor:"#16A34A"})),
      ce("linearGradient",{id:"gS",x1:"0",y1:"0",x2:"0",y2:"1"},ce("stop",{offset:"0%",stopColor:"#FB7185"}),ce("stop",{offset:"100%",stopColor:"#DC2626"}))
    ),
    ce("line",{x1:0,y1:H,x2:W,y2:H,stroke:"#E2E8F0",strokeWidth:1})
  );
}
function DonutChart(p){
  var slices=p.slices,sz=p.size||120;
  var total=slices.reduce(function(s,x){return s+(x.valor||0)},0);
  if(!total)return null;
  var R2=sz*0.39,ri=sz*0.23,cx=sz/2,cy=sz/2,start=-Math.PI/2;
  var arcs=slices.filter(function(sl){return sl.valor>0}).map(function(sl,i){
    var ang=(sl.valor/total)*2*Math.PI;if(ang<0.02){start+=ang;return null}
    var end=start+ang,lg=ang>Math.PI?1:0;
    var x1=cx+R2*Math.cos(start),y1=cy+R2*Math.sin(start),x2=cx+R2*Math.cos(end),y2=cy+R2*Math.sin(end);
    var ix1=cx+ri*Math.cos(start),iy1=cy+ri*Math.sin(start),ix2=cx+ri*Math.cos(end),iy2=cy+ri*Math.sin(end);
    var dd="M"+x1.toFixed(1)+","+y1.toFixed(1)+" A"+R2+","+R2+" 0 "+lg+" 1 "+x2.toFixed(1)+","+y2.toFixed(1)+" L"+ix2.toFixed(1)+","+iy2.toFixed(1)+" A"+ri+","+ri+" 0 "+lg+" 0 "+ix1.toFixed(1)+","+iy1.toFixed(1)+"Z";
    start=end;
    return ce("path",{key:i,d:dd,fill:sl.color,stroke:"#fff",strokeWidth:2.5});
  }).filter(Boolean);
  return ce("div",{style:{display:"flex",alignItems:"center",gap:14}},
    ce("svg",{width:sz,height:sz,viewBox:"0 0 "+sz+" "+sz,style:{flexShrink:0}},
      arcs,
      ce("text",{x:cx,y:cy-5,textAnchor:"middle",fontSize:9,fill:C.sub,fontWeight:"600"},"Total"),
      ce("text",{x:cx,y:cy+9,textAnchor:"middle",fontSize:8,fill:C.txt,fontWeight:"800"},fmt(total))
    ),
    ce("div",{style:{flex:1}},slices.filter(function(sl){return sl.valor>0}).map(function(sl,i){
      return ce("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7,animation:"fadeIn .2s ease "+(i*.04)+"s both"}},
        ce("div",{style:{display:"flex",alignItems:"center",gap:6}},ce("div",{style:{width:10,height:10,borderRadius:"50%",background:sl.color,flexShrink:0}}),ce("span",{style:{fontSize:11,color:C.txt}},sl.label)),
        ce("div",null,ce("span",{style:{fontSize:11,fontWeight:800,color:sl.color}},fmt(sl.valor)),ce("span",{style:{fontSize:9,color:C.muted,marginLeft:3}},(sl.valor/total*100).toFixed(0)+"%"))
      );
    }))
  );
}

/* LOGIN (melhoria 8) */
function LoginScreen(p){
  var s1=useState(""),user=s1[0],setUser=s1[1];
  var s2=useState(""),pass=s2[0],setPass=s2[1];
  var s3=useState(""),error=s3[0],setError=s3[1];

    if(!user||!pass){setError("Preencha todos os campos");return}

      var u=USERS[user];
      if(u&&u.hash===h){setSession({nome:user,role:u.role});p.onLogin({nome:user,role:u.role})}
      else setError("Usuário ou senha incorretos");
      setLoading(false);

    updC:guard(function(id,ch){upd("compras",id,ch)}),
    updD:guard(function(id,ch){upd("despesas",id,ch)}),
    delV:guard(function(id){del("vendas",id)}),
    delC:guard(function(id){del("compras",id)}),
    delD:guard(function(id){del("despesas",id)}),
    addFunc:guard(function(f){add("funcionarios",_o({ativo:true},f))}),
    updFunc:guard(function(id,ch){upd("funcionarios",id,ch)}),
    delFunc:guard(function(id){mut(function(d){return _o({},d,{funcionarios:d.funcionarios.filter(function(x){return x.id!==id}),adiantamentos:d.adiantamentos.filter(function(x){return x.funcId!==id})})})}),
    addAdiant:guard(function(a){
      var aid=uid();
      mut(function(d){var fn=d.funcionarios.find(function(f){return f.id===a.funcId});return _o({},d,{adiantamentos:d.adiantamentos.concat([_o({id:aid},a)]),despesas:d.despesas.concat([{id:uid(),data:a.data,descricao:"Vale — "+(fn?fn.nome:"Funcionário"),categoria:"Funcionarios",tipo:"Variavel",valor:a.valor,status:"Pago",_adiantId:aid}])})});
    }),
    delAdiant:guard(function(id){mut(function(d){return _o({},d,{adiantamentos:d.adiantamentos.filter(function(x){return x.id!==id}),despesas:d.despesas.filter(function(x){return x._adiantId!==id})})})})
  };

  var filt=useMemo(function(){return{vendas:byPeriod(data.vendas,per,s,e),compras:byPeriod(data.compras,per,s,e),despesas:byPeriod(data.despesas,per,s,e)}},[data,per,s,e]);
  var totals=useMemo(function(){
    var tv=filt.vendas.reduce(function(a,x){return a+vtotal(x)},0),tc=filt.compras.reduce(function(a,x){return a+ctotal(x)},0),td=filt.despesas.reduce(function(a,x){return a+(x.valor||0)},0);
    var tdPago=filt.despesas.filter(function(x){return x.status==="Pago"}).reduce(function(a,x){return a+(x.valor||0)},0);
    return{tv:tv,tc:tc,td:td,tdPago:tdPago,tdPend:td-tdPago,lucro:tv-tc-td,
      vPix:filt.vendas.reduce(function(a,x){return a+(x.pix||0)},0),vDinheiro:filt.vendas.reduce(function(a,x){return a+(x.dinheiro||0)},0),
      vFiado:filt.vendas.reduce(function(a,x){return a+(x.fiado||0)},0),vCartao:filt.vendas.reduce(function(a,x){return a+(x.cartao||0)},0),vBoleto:filt.vendas.reduce(function(a,x){return a+(x.boleto||0)},0)};
  },[filt]);
  var venc=useMemo(function(){return data.despesas.filter(function(d){return d.vencimento&&d.status==="A Pagar"}).sort(function(a,b){return vencInfo(a).ord-vencInfo(b).ord})},[data.despesas]);
  var alertas=useMemo(function(){return venc.filter(function(d){var dd=diffDays(d.vencimento);return dd!==null&&dd<=3})},[venc]);

  function openNew(type){if(isViewer)return;setModal({type:type||"despesa",editId:null,initialForm:{data:today(),status:"A Pagar",tipo:"Variavel",recorrente:false,frequencia:"mensal",nRep:"6"}})}
  function openEdit(type,item){if(isViewer)return;setModal({type:type,editId:item.id,initialForm:_o({},item)})}
  function closeModal(){setModal(null)}
  function goVenc(){setNav("vencimentos")}

  function handleSubmit(type,editId,payload){
    if(isViewer)return;
    if(editId){
      if(type==="venda")ops.updV(editId,payload);else if(type==="compra")ops.updC(editId,payload);else ops.updD(editId,payload);
    } else {
      if(type==="venda")ops.addV(payload);
      else if(type==="compra")ops.addC(payload);
      else {
        if(payload.recorrente){
          var base=new Date(payload.data+"T12:00:00"),n=parseInt(payload.nRep)||6,freq=payload.frequencia||"mensal";
          var copies=[_o({},payload,{_recorrente:true})];
          for(var i=1;i<=n;i++){
            var d=new Date(base);
            if(freq==="mensal")d.setMonth(d.getMonth()+i);else if(freq==="quinzenal")d.setDate(d.getDate()+i*15);else d.setDate(d.getDate()+i*7);
            copies.push(_o({},payload,{data:localDate(d),recorrente:false,_recorrente:true,status:"A Pagar",vencimento:localDate(d)}));
          }
          addMany("despesas",copies);closeModal();return;
        }
        ops.addD(payload);
      }
    }
    closeModal();
  }

  if(!session)return ce(LoginScreen,{onLogin:function(u){setSession2(u)}});
  if(!ready)return ce("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"linear-gradient(160deg,#064E3B,#0A2010)"}},
    ce("div",{style:{textAlign:"center",color:"#94A3B8"}},ce(AppIcon,{size:80}),ce("div",{style:{fontSize:14,fontWeight:600,marginTop:14,color:"#6EE7B7"}},"Carregando…")));

  return ce("div",{style:{maxWidth:480,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:C.bg,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden",position:"relative"}},
    ce("div",{style:{position:"relative",zIndex:300}},
      ce(SyncBar,{status:syncSt}),
      ce(OfflineBar,null),
      ce(UserBar,{session:session,onLogout:function(){clearSession();setSession2(null)}})
    ),
    ce("div",{style:{flex:1,overflowY:"auto",paddingBottom:nav==="mais"?136:72}},
      nav==="dashboard"&&ce(Dashboard,{data:data,totals:totals,alertas:alertas,p:per,setP:setPer,s:s,setS:setS,e:e,setE:setE,onNew:openNew,onGoVenc:goVenc}),
      nav==="registros"&&ce(Registros,{data:data,tab:regTab,setTab:setRegTab,onEdit:openEdit,isViewer:isViewer,onDelV:ops.delV,onDelC:ops.delC,onDelD:ops.delD,onToggle:function(id){if(isViewer)return;var cur=data.despesas.find(function(d){return d.id===id});if(cur)ops.updD(id,{status:cur.status==="Pago"?"A Pagar":"Pago"})}}),
      nav==="vencimentos"&&ce(Vencimentos,{venc:venc,isViewer:isViewer,onEdit:function(d){openEdit("despesa",d)},onToggle:function(id){if(isViewer)return;ops.updD(id,{status:"Pago"})}}),
      nav==="mais"&&mais==="salarios"&&ce(Salarios,{data:data,isViewer:isViewer,addFunc:ops.addFunc,updFunc:ops.updFunc,delFunc:ops.delFunc,addAdiant:ops.addAdiant,delAdiant:ops.delAdiant}),
      nav==="mais"&&mais==="fechamento"&&ce(Fechamento,{data:data}),
      nav==="mais"&&mais==="config"&&ce(Config,{data:data,isViewer:isViewer,update:isViewer?function(){}:setData})
    ),
    ce(Nav,{nav:nav,setNav:setNav,mais:mais,setMais:setMais,badge:alertas.length,onPlus:function(){openNew()}}),
    modal&&!isViewer&&ce(Modal,{type:modal.type,initialForm:modal.initialForm,cats:{despesa:data.catsDespesa,compra:data.catsCompra},editId:modal.editId,onSubmit:handleSubmit,onClose:closeModal})
  );
}

/* MOUNT */
try{
  document.getElementById("loading").style.display="none";
  ReactDOM.createRoot(document.getElementById("root")).render(ce(App,null));
}catch(err){
  var el=document.getElementById("loading");
  el.innerHTML='<div style="color:#F87171;font-size:13px;padding:24px;text-align:center"><b>Erro ao carregar</b><br/><br/>'+err.message+'</div>';
  el.style.display="flex";
}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
