var OFK="erp_offline_v2";
function fbPatch(url,data){
  return fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields:{payload:{stringValue:JSON.stringify(data)}}})});
}
function saveData(data){
  if(!navigator.onLine){try{localStorage.setItem(OFK,JSON.stringify(data))}catch(e){}return}
  fbPatch(FB_URL,data).then(function(){
    try{localStorage.removeItem(OFK)}catch(e){}
    fbPatch(FB_BASE+"/backups/bk_"+new Date().toISOString().split("T")[0]+"?key="+FB_KEY,data).catch(function(){});
  }).catch(function(){try{localStorage.setItem(OFK,JSON.stringify(data))}catch(e){}});
}
function loadData(){
  return fetch(FB_URL).then(function(r){if(!r.ok)throw new Error("err");return r.json()})
    .then(function(j){return JSON.parse(j.fields.payload.stringValue)})
    .catch(function(){try{var p=localStorage.getItem(OFK);if(p)return JSON.parse(p)}catch(e){}return null});
}

  try{var p=localStorage.getItem(OFK);if(p)fbPatch(FB_URL,JSON.parse(p)).then(function(){localStorage.removeItem(OFK)})}catch(e){}

function byPeriod(items,p,s,e,f){
  f=f||"data";var now=new Date();now.setHours(12,0,0,0);
  return items.filter(function(it){
    var raw=it[f];if(!raw)return false;
    var d=new Date(raw+"T12:00:00");if(isNaN(d))return false;
    if(p==="hoje")return d.toDateString()===now.toDateString();
    if(p==="semana"){var dy=now.getDay()||7,mn=new Date(now);mn.setDate(now.getDate()-dy+1);var sn=new Date(mn);sn.setDate(mn.getDate()+6);return d>=mn&&d<=sn}
    if(p==="mes")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();

function buildMesesOpts(adts){
  var set=new Set();var now=new Date();
  for(var i=0;i<13;i++){var d=new Date(now.getFullYear(),now.getMonth()-i,1);set.add(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}

function DonutChart(p){
  var slices=p.slices,sz=p.size||120;
  var total=slices.reduce(function(s,x){return s+(x.valor||0)},0);
  if(!total)return null;

    var ix1=cx+ri*Math.cos(start),iy1=cy+ri*Math.sin(start),ix2=cx+ri*Math.cos(end),iy2=cy+ri*Math.sin(end);
    var dd="M"+x1.toFixed(1)+","+y1.toFixed(1)+" A"+R2+","+R2+" 0 "+lg+" 1 "+x2.toFixed(1)+","+y2.toFixed(1)+" L"+ix2.toFixed(1)+","+iy2.toFixed(1)+" A"+ri+","+ri+" 0 "+lg+" 0 "+ix1.toFixed(1)+","+iy1.toFixed(1)+"Z";

  }).filter(Boolean);

    ce("svg",{width:sz,height:sz,viewBox:"0 0 "+sz+" "+sz,style:{flexShrink:0}},

        ce("div",{style:{display:"flex",alignItems:"center",gap:5}},ce("div",{style:{width:9,height:9,borderRadius:"50%",background:sl.color,flexShrink:0}}),ce("span",{style:{fontSize:11,color:C.txt}},sl.label)),
        ce("div",null,ce("span",{style:{fontSize:11,fontWeight:800,color:sl.color}},fmt(sl.valor)),ce("span",{style:{fontSize:9,color:C.muted,marginLeft:3}},(sl.valor/total*100).toFixed(0)+"%"))

    ce("div",{style:{flex:1,overflowY:"auto",paddingBottom:nav==="mais"?136:72}},
      nav==="dashboard"&&ce(Dashboard,{data:data,totals:totals,alertas:alertas,p:per,setP:setPer,s:s,setS:setS,e:e,setE:setE,onNew:openNew}),
      nav==="registros"&&ce(Registros,{data:data,tab:regTab,setTab:setRegTab,onEdit:openEdit,onDelV:ops.delV,onDelC:ops.delC,onDelD:ops.delD,onToggle:function(id){var cur=data.despesas.find(function(d){return d.id===id});if(cur)ops.updD(id,{status:cur.status==="Pago"?"A Pagar":"Pago"})}}),
      nav==="vencimentos"&&ce(Vencimentos,{venc:venc,onEdit:function(d){openEdit("despesa",d)},onToggle:function(id){ops.updD(id,{status:"Pago"})}}),
      nav==="mais"&&mais==="salarios"&&ce(Salarios,{data:data,addFunc:ops.addFunc,updFunc:ops.updFunc,delFunc:ops.delFunc,addAdiant:ops.addAdiant,delAdiant:ops.delAdiant}),
      nav==="mais"&&mais==="fechamento"&&ce(Fechamento,{data:data}),
      nav==="mais"&&mais==="config"&&ce(Config,{data:data,update:setData})
    ),
    ce(Nav,{nav:nav,setNav:setNav,mais:mais,setMais:setMais,badge:alertas.length,onPlus:function(){openNew()}}),
    modal&&ce(Modal,{type:modal.type,initialForm:modal.initialForm,cats:{despesa:data.catsDespesa,compra:data.catsCompra},editId:modal.editId,onSubmit:handleSubmit,onClose:closeModal})
  );
}

/* ─── MOUNT ─── */
try{
  document.getElementById("loading").style.display="none";
  ReactDOM.createRoot(document.getElementById("root")).render(ce(App,null));
}catch(err){
  var el=document.getElementById("loading");
  el.innerHTML='<div style="color:#F87171;font-size:13px;padding:20px;text-align:center;"><b>Erro ao carregar</b><br/><br/>'+err.message+'</div>';
  el.style.display="flex";
  console.error(err);
}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
