function WeekBarChart(p){
  var data=p.data;
  var max=Math.max.apply(Math,data.map(function(d){return Math.max(d.Vendas||0,d.Saidas||0)}).concat([1]));
  var H=100,bW=17,gap=3,gW=bW*2+gap+12,W=data.length*gW+6;
  return ce("svg",{width:"100%",viewBox:"0 0 "+W+" "+(H+36),style:{overflow:"visible"}},
    data.map(function(d,i){
      var x=i*gW+6;
      var hV=Math.max(Math.round((d.Vendas||0)/max*H),0),hS=Math.max(Math.round((d.Saidas||0)/max*H),0);
      var isToday=d.isToday;
      return ce("g",{key:i},
        isToday&&ce("rect",{x:x-4,y:0,width:bW*2+gap+8,height:H+4,rx:6,fill:"#F8FAFC",opacity:.7}),

        ce("button",{"aria-label":"Novo registro",onClick:function(){setPulsing(true);setTimeout(function(){setPulsing(false)},320);p.onPlus()},style:{width:52,height:52,borderRadius:"50%",background:"linear-gradient(135deg,"+C.accMid+","+C.acc+")",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 6px 18px rgba(27,94,32,.45)",marginBottom:6,animation:pulsing?"navPulse .32s ease":"none"}},

}

/* APP */
function App(){
  var a1=useState(getSession()),session=a1[0],setSession2=a1[1];
  var isViewer=session&&session.role==="viewer";
  var a2=useState(INIT),data=a2[0],setData=a2[1];
  var a3=useState(false),ready=a3[0],setReady=a3[1];
  var a4=useState("dashboard"),nav=a4[0],setNav=a4[1];
  var a5=useState("salarios"),mais=a5[0],setMais=a5[1];
  var a6=useState(null),modal=a6[0],setModal=a6[1];
  var a7=useState("despesas"),regTab=a7[0],setRegTab=a7[1];
  var a8=useState("mes"),per=a8[0],setPer=a8[1];
  var a9=useState(""),s=a9[0],setS=a9[1];
  var a10=useState(""),e=a10[0],setE=a10[1];
  var a11=useState("idle"),syncSt=a11[0],setSyncSt=a11[1];
  var a12=useState(false),alertDismissed=a12[0],setAlertDismissed=a12[1];
  var a13=useState(false),hasPending=a13[0],setHasPending=a13[1];
  var aT=useState(null),toast=aT[0],setToast=aT[1];
  var aTL=useState(false),tLeaving=aTL[0],setTLeaving=aTL[1];
  var toastTimers=useRef([]);
  var firstLoad=useRef(true),syncTimer=useRef(null),prevData=useRef(null);
  window._setSyncStatus=setSyncSt;

  function showToast(type,msg){

    toastTimers.current.push(setTimeout(function(){setToast(null);setTLeaving(false)},2900));
  }

  useEffect(function(){
    loadData().then(function(result){
      if(result.data){var rd=result.data;var migrated=false;if(rd.despesas){var newD=rd.despesas.map(function(d){var fix=_o({},d),ch=false;if(fix.categoria==="Funcionarios"){fix.categoria="Funcionários";ch=true;}if(fix._adiantId&&fix.tipo==="Variável"){fix.tipo="Fixo";ch=true;}if(ch)migrated=true;return fix;});if(migrated)rd=_o({},rd,{despesas:newD});}setData(function(prev){return _o({},INIT,rd)});if(migrated)saveData(rd,function(){});}
      setReady(true);
      setHasPending(!!localStorage.getItem(OFK));
      if(result.source==="local"){setSyncSt("loadLocal");setTimeout(function(){setSyncSt("idle")},5000);}
      else if(result.source==="empty"){setSyncSt("loadError");setTimeout(function(){setSyncSt("idle")},8000);}
    });
  },[]);

  useEffect(function(){
    if(!ready)return;
    if(firstLoad.current){firstLoad.current=false;prevData.current=data;return}
    if(JSON.stringify(data)===JSON.stringify(prevData.current))return;
    prevData.current=data;
    clearTimeout(syncTimer.current);
    saveData(data,function(st){
      setSyncSt(st);
      if(st==="cloud"||st==="synced")setHasPending(false);
      if(st==="local"||st==="error")setHasPending(true);
      if(st==="cloud"||st==="local"||st==="error"){
        syncTimer.current=setTimeout(function(){setSyncSt("idle")},3200);
      }
    });
  },[data,ready]);

  function mut(fn){setData(function(d){return fn(_o({},d))})}
  function add(col,item){mut(function(d){var n=_o({},d);n[col]=d[col].concat([_o({id:uid()},item)]);return n})}
  function upd(col,id,ch){mut(function(d){var n=_o({},d);n[col]=d[col].map(function(x){return x.id===id?_o({},x,ch):x});return n})}
  function del(col,id){mut(function(d){var n=_o({},d);n[col]=d[col].filter(function(x){return x.id!==id});return n})}
  function addMany(col,items){mut(function(d){var n=_o({},d);n[col]=d[col].concat(items.map(function(it){return _o({id:uid()},it)}));return n})}

  /* melhoria 4 — guard viewer em todas as ops */
  function guard(fn){return function(){if(isViewer)return;fn.apply(null,arguments)}}

  var ops={
    addV:guard(function(v){add("vendas",v)}),
    addC:guard(function(c){add("compras",c)}),
    addD:guard(function(dp){add("despesas",dp)}),
    updV:guard(function(id,ch){upd("vendas",id,ch)}),
    updC:guard(function(id,ch){upd("compras",id,ch)}),
    updD:guard(function(id,ch){upd("despesas",id,ch)}),
    delV:guard(function(id){del("vendas",id)}),
    delC:guard(function(id){del("compras",id)}),
    delD:guard(function(id){del("despesas",id)}),
    addFunc:guard(function(f){add("funcionarios",_o({ativo:true},f))}),
    updFunc:guard(function(id,ch){upd("funcionarios",id,ch)}),
    delFunc:guard(function(id){mut(function(d){return _o({},d,{funcionarios:d.funcionarios.filter(function(x){return x.id!==id}),adiantamentos:d.adiantamentos.filter(function(x){return x.funcId!==id}),despesas:d.despesas.filter(function(x){return x._salFuncId!==id})})})}),
    addAdiant:guard(function(a){
      var aid=uid();
      mut(function(d){var fn=d.funcionarios.find(function(f){return f.id===a.funcId});return _o({},d,{adiantamentos:d.adiantamentos.concat([_o({id:aid},a)]),despesas:d.despesas.concat([{id:uid(),data:a.data,descricao:"Vale — "+(fn?fn.nome:"Funcionário"),categoria:"Funcionários",tipo:"Fixo",valor:a.valor,status:"Pago",_adiantId:aid}])})});
    }),
    delAdiant:guard(function(id){mut(function(d){return _o({},d,{adiantamentos:d.adiantamentos.filter(function(x){return x.id!==id}),despesas:d.despesas.filter(function(x){return x._adiantId!==id})})})}),
    pagarSalario:guard(function(funcId,mes){mut(function(d){var func=d.funcionarios.find(function(f){return f.id===funcId});if(!func)return d;var valesDoMes=d.adiantamentos.filter(function(a){return a.funcId===funcId&&(a.mesRef||a.data.slice(0,7))===mes}).reduce(function(s,a){return s+(a.valor||0)},0);var saldo=(func.salarioBase||0)-valesDoMes;if(saldo<=0)return d;var semSalAnterior=d.despesas.filter(function(x){return!(x._salFuncId===funcId&&x._salMes===mes)});var novaDesp={id:uid(),data:mes+"-01",descricao:"Salário — "+func.nome,categoria:"Funcionários",tipo:"Fixo",valor:saldo,status:"Pago",_salFuncId:funcId,_salMes:mes};return _o({},d,{despesas:semSalAnterior.concat([novaDesp])});})})
  };

  var filt=useMemo(function(){return{vendas:byPeriod(data.vendas,per,s,e),compras:byPeriod(data.compras,per,s,e),despesas:byPeriod(data.despesas,per,s,e)}},[data,per,s,e]);
  var totals=useMemo(function(){
    var tv=filt.vendas.reduce(function(a,x){return a+vtotal(x)},0),tc=filt.compras.reduce(function(a,x){return a+ctotal(x)},0),td=filt.despesas.reduce(function(a,x){return a+(x.valor||0)},0);
    var tdPago=filt.despesas.filter(function(x){return x.status==="Pago"}).reduce(function(a,x){return a+(x.valor||0)},0);
    return{tv:tv,tc:tc,td:td,tdPago:tdPago,tdPend:td-tdPago,lucro:tv-tc-td,
      vPix:filt.vendas.reduce(function(a,x){return a+(x.pix||0)},0),vDinheiro:filt.vendas.reduce(function(a,x){return a+(x.dinheiro||0)},0),
      vFiado:filt.vendas.reduce(function(a,x){return a+(x.fiado||0)},0),vCartao:filt.vendas.reduce(function(a,x){return a+(x.cartao||0)},0),vBoleto:filt.vendas.reduce(function(a,x){return a+(x.boleto||0)},0)};
  },[filt]);
  var venc=useMemo(function(){return data.despesas.filter(function(d){return d.vencimento&&d.status==="A Pagar"}).sort(function(a,b){return vencInfo(a).ord-vencInfo(b).ord})},[data.despesas]);
  var alertas=useMemo(function(){return venc.filter(function(d){var dd=diffDays(d.vencimento);return dd!==null&&dd<=3})},[venc]);

  function openNew(type){if(isViewer)return;setModal({type:type||"despesa",editId:null,initialForm:{data:today(),status:"A Pagar",tipo:"Variável",recorrente:false,frequencia:"mensal",nRep:"6"}})}
  function openEdit(type,item){if(isViewer)return;setModal({type:type,editId:item.id,initialForm:_o({},item)})}
  function closeModal(){setModal(null)}
  function goVenc(){setNav("vencimentos")}
  function syncNow(){
    setSyncSt("syncing");
    fbPatch(FB_URL,data).then(function(res){
      if(!res.ok)throw new Error("err");
      localStorage.removeItem(OFK);
      setHasPending(false);
      setSyncSt("synced");
      showToast("success","Sincronizado com sucesso");
      setTimeout(function(){setSyncSt("idle")},3000);
    }).catch(function(){setSyncSt("error");showToast("error","Falha ao sincronizar");});
  }

  function handleSubmit(type,editId,payload){
    if(isViewer)return;
    if(editId){
      if(type==="venda")ops.updV(editId,payload);else if(type==="compra")ops.updC(editId,payload);else ops.updD(editId,payload);
    } else {
      if(type==="venda")ops.addV(payload);
      else if(type==="compra")ops.addC(payload);
      else {
        if(payload.recorrente){
          var base=new Date(payload.data+"T12:00:00"),n=parseInt(payload.nRep)||6,freq=payload.frequencia||"mensal";
          var copies=[_o({},payload,{_recorrente:true})];
          for(var i=1;i<=n;i++){
            var d=new Date(base);
            if(freq==="mensal")d.setMonth(d.getMonth()+i);else if(freq==="quinzenal")d.setDate(d.getDate()+i*15);else d.setDate(d.getDate()+i*7);
            copies.push(_o({},payload,{data:localDate(d),recorrente:false,_recorrente:true,status:"A Pagar",vencimento:localDate(d)}));
          }
          addMany("despesas",copies);closeModal();showToast("success","Lançamentos recorrentes adicionados");return;
        }
        ops.addD(payload);
      }
    }
    closeModal();
    showToast("success",editId?"Registro atualizado":"Registro adicionado");
  }

  if(!session)return ce(LoginScreen,{onLogin:function(u){setSession2(u)}});
  if(!ready)return ce("div",{style:{maxWidth:480,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:C.bg,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden"}},
    ce("div",{style:{paddingTop:"env(safe-area-inset-top,0px)",background:C.dark}},ce(UserBar,{session:session,onLogout:function(){clearSession();setSession2(null)}})),
    ce("div",{style:{flex:1,overflow:"hidden"}},ce(SkelDash,null)));

  return ce("div",{style:{maxWidth:480,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:C.bg,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden",position:"relative"}},
    ce(Toast,{toast:toast,leaving:tLeaving}),
    ce("div",{style:{position:"relative",zIndex:300,paddingTop:"env(safe-area-inset-top,0px)",background:C.dark}},
      ce(SyncBar,{status:syncSt}),
      ce(OfflineBar,null),
      ce(PendingBar,{hasPending:hasPending,onSync:syncNow}),
      ce(UserBar,{session:session,onLogout:function(){clearSession();setSession2(null)}})
    ),
    ce("div",{style:{flex:1,overflowY:"auto",paddingBottom:nav==="mais"?136:72}},
      nav==="dashboard"&&ce(Dashboard,{data:data,totals:totals,alertas:alertas,p:per,setP:setPer,s:s,setS:setS,e:e,setE:setE,onNew:openNew,onGoVenc:goVenc,alertDismissed:alertDismissed,onDismissAlert:function(){setAlertDismissed(true)}}),
      nav==="registros"&&ce(Registros,{data:data,tab:regTab,setTab:setRegTab,onEdit:openEdit,isViewer:isViewer,onDelV:ops.delV,onDelC:ops.delC,onDelD:ops.delD,onToggle:function(id){if(isViewer)return;var cur=data.despesas.find(function(d){return d.id===id});if(cur)ops.updD(id,{status:cur.status==="Pago"?"A Pagar":"Pago",dataPagamento:cur.status==="Pago"?null:localDate()})},onBatchPay:function(ids){if(isViewer)return;var now=localDate();mut(function(d){var n=_o({},d);n.despesas=d.despesas.map(function(x){return ids.indexOf(x.id)>=0?_o({},x,{status:"Pago",dataPagamento:now}):x});return n})}}),
      nav==="vencimentos"&&ce(Avisos,{venc:venc,alertas:alertas,isViewer:isViewer,onEdit:function(d){openEdit("despesa",d)},onToggle:function(id){if(isViewer)return;ops.updD(id,{status:"Pago",dataPagamento:localDate()})}}),
      nav==="mais"&&mais==="salarios"&&ce(Salarios,{data:data,isViewer:isViewer,addFunc:ops.addFunc,updFunc:ops.updFunc,delFunc:ops.delFunc,addAdiant:ops.addAdiant,delAdiant:ops.delAdiant,pagarSalario:ops.pagarSalario}),
      nav==="mais"&&mais==="fechamento"&&ce(Fechamento,{data:data}),
      nav==="mais"&&mais==="config"&&ce(Config,{data:data,isViewer:isViewer,update:isViewer?function(){}:setData})
    ),
    ce(Nav,{nav:nav,setNav:setNav,mais:mais,setMais:setMais,badge:alertas.length,onPlus:function(){openNew()}}),

  );
}

try{
  ReactDOM.createRoot(document.getElementById("root")).render(ce(App,null));
  (function(){
