<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#F7F3E9"/>
<title>Agro Bras — Brand Intro</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  overflow:hidden;
  display:grid;place-items:center;
  background:
    radial-gradient(130% 95% at 50% 36%,#FFFEFB 0%,#FAF6EC 42%,#EFE8D6 78%,#E6DCC4 100%);
  font-family:'Cinzel',Georgia,'Times New Roman',serif;
}

/* ---------- camadas ambientais ---------- */
#dust{position:fixed;inset:0;pointer-events:none;z-index:1}
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 100% at 50% 45%,transparent 58%,rgba(74,58,24,.10) 100%);
}

/* ---------- câmera / cena ---------- */
.stage{perspective:1200px;z-index:3}
.scene{
  transform-style:preserve-3d;
  animation:camera 4.8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes camera{
  0%{transform:scale(1.26) translateY(26px) rotateX(9deg);opacity:0}
  18%{opacity:1}
  100%{transform:scale(1) translateY(0) rotateX(0deg);opacity:1}
}

.lockup{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:24px 40px;
}

/* halo dourado suave atrás do símbolo */
.bloom{
  position:absolute;top:2%;left:50%;width:430px;height:430px;
  transform:translateX(-50%);
  background:radial-gradient(circle,rgba(232,163,61,.20) 0%,rgba(232,163,61,.07) 45%,transparent 70%);
  filter:blur(6px);
  animation:bloomIn 1.6s ease-out both, breathe 4.5s 4.8s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes bloomIn{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes breathe{from{opacity:.78;transform:translateX(-50%) scale(1)}to{opacity:1;transform:translateX(-50%) scale(1.06)}}

/* ---------- símbolo ---------- */
svg.mark{
  width:min(340px,72vw);height:auto;display:block;
  filter:drop-shadow(0 22px 30px rgba(27,94,32,.16));
}
.draw{
  stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 1.15s cubic-bezier(.55,.08,.25,1) both;
  animation-delay:var(--d,0s);
}
@keyframes draw{to{stroke-dashoffset:0}}

.leaf{
  opacity:0;transform-origin:188px 64px;
  animation:leafPop .75s cubic-bezier(.34,1.45,.5,1) both;
  animation-delay:var(--d,1.7s);
}
@keyframes leafPop{
  0%{opacity:0;transform:scale(0) rotate(-24deg)}
  70%{opacity:1;transform:scale(1.07) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.vein{
  stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw .6s ease-out both;animation-delay:var(--d,2.15s);
}

/* varredura de luz, mascarada pelo próprio símbolo */
.sheen-bar{
  opacity:0;
  animation:sheenMove 1.15s cubic-bezier(.4,0,.2,1) 3.65s both;
}
@keyframes sheenMove{
  0%{transform:translateX(-70px) skewX(-18deg);opacity:0}
  12%{opacity:1}
  88%{opacity:1}
  100%{transform:translateX(400px) skewX(-18deg);opacity:0}
}

/* ---------- tipografia ---------- */
.word{
  margin-top:26px;
  display:flex;
  font-size:clamp(30px,8vw,46px);
  font-weight:600;
  color:#1C4B2A;
  animation:tracking 1.7s cubic-bezier(.16,1,.3,1) 2.45s both;
}
@keyframes tracking{from{letter-spacing:.42em}to{letter-spacing:.16em}}
.word span{
  opacity:0;
  animation:letterIn .85s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(2.45s + var(--i)*.07s);
}
.word .gap{width:.55em}
@keyframes letterIn{
  from{opacity:0;transform:translateY(26px);filter:blur(9px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}

.divider{
  margin-top:16px;
  display:flex;align-items:center;gap:12px;
  opacity:0;animation:fadeUp .9s ease-out 3.35s both;
}
.divider .line{width:64px;height:1px;background:linear-gradient(90deg,transparent,rgba(28,75,42,.45))}
.divider .line:last-child{background:linear-gradient(90deg,rgba(28,75,42,.45),transparent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---------- replay ---------- */
.replay{
  position:fixed;right:22px;bottom:20px;z-index:4;
  border:1px solid rgba(28,75,42,.25);background:transparent;color:#3D6B4A;
  font-family:inherit;font-size:12px;letter-spacing:.12em;
  padding:8px 16px;border-radius:99px;cursor:pointer;
  opacity:0;animation:fadeUp .8s ease-out 5.2s both;
  transition:background .2s,color .2s;
}
.replay:hover{background:rgba(28,75,42,.08)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  #dust{display:none}
}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="stage">
  <div class="scene" id="scene">
    <div class="lockup" role="img" aria-label="Agro Bras">
      <div class="bloom"></div>

      <svg class="mark" viewBox="0 0 320 256" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gGreen" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#0F4D1E"/><stop offset=".55" stop-color="#2E7D32"/><stop offset="1" stop-color="#5DAF49"/>
          </linearGradient>
          <linearGradient id="gGold" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F0B43C"/><stop offset=".6" stop-color="#DD9A1B"/><stop offset="1" stop-color="#C07F0C"/>
          </linearGradient>
          <linearGradient id="gRed" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#C44531"/><stop offset="1" stop-color="#822317"/>
          </linearGradient>
          <linearGradient id="gGreenIn" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#7CC242"/>
          </linearGradient>
          <linearGradient id="gLeafR" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#1B5E20"/><stop offset="1" stop-color="#66BB3A"/>
          </linearGradient>
          <linearGradient id="gLeafL" x1="1" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#2E7D32"/><stop offset="1" stop-color="#8BC34A"/>
          </linearGradient>
          <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
            <stop offset=".5" stop-color="#FFF" stop-opacity=".8"/>
            <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
          </linearGradient>
          <mask id="markMask">
            <g fill="none" stroke="#FFF" stroke-linecap="round">
              <path stroke-width="23" d="M 84.6 202.8 A 92 92 0 0 1 230.5 90.9"/>
              <path stroke-width="21" d="M 232.1 99.5 A 88 88 0 1 1 80.2 187.2"/>
              <path stroke-width="15" d="M 214.4 175.4 A 60 60 0 0 1 125.6 199.2"/>
              <path stroke-width="12" d="M 104 165 A 58 58 0 0 1 175 94"/>
              <path stroke-width="8.5" d="M 194 152 C 194 128 176 114 158 117 C 140 120 130 136 134 152 C 138 167 152 173 164 167 C 173 162 175 151 167 146 C 162 143 155 145 154 151"/>
            </g>
            <path fill="#FFF" d="M 192 64 C 188 38 206 14 240 6 C 246 34 224 58 192 64 Z"/>
            <path fill="#FFF" d="M 184 62 C 164 52 154 28 160 4 C 186 12 194 40 184 62 Z"/>
          </mask>
        </defs>

        <!-- redemoinho -->
        <g stroke-linecap="round">
          <path class="draw" style="--d:.35s" pathLength="1" stroke="url(#gGreen)"   stroke-width="23"  d="M 84.6 202.8 A 92 92 0 0 1 230.5 90.9"/>
          <path class="draw" style="--d:.55s" pathLength="1" stroke="url(#gGold)"    stroke-width="21"  d="M 232.1 99.5 A 88 88 0 1 1 80.2 187.2"/>
          <path class="draw" style="--d:.85s" pathLength="1" stroke="url(#gRed)"     stroke-width="15"  d="M 214.4 175.4 A 60 60 0 0 1 125.6 199.2"/>
          <path class="draw" style="--d:1s"   pathLength="1" stroke="url(#gGreenIn)" stroke-width="12"  d="M 104 165 A 58 58 0 0 1 175 94"/>
          <path class="draw" style="--d:1.2s" pathLength="1" stroke="url(#gGold)"    stroke-width="8.5" d="M 194 152 C 194 128 176 114 158 117 C 140 120 130 136 134 152 C 138 167 152 173 164 167 C 173 162 175 151 167 146 C 162 143 155 145 154 151"/>
        </g>

        <!-- folhas -->
        <path class="leaf" style="--d:1.7s"  fill="url(#gLeafL)" d="M 184 62 C 164 52 154 28 160 4 C 186 12 194 40 184 62 Z"/>
        <path class="leaf" style="--d:1.85s" fill="url(#gLeafR)" d="M 192 64 C 188 38 206 14 240 6 C 246 34 224 58 192 64 Z"/>
        <g stroke="#DCEDC8" stroke-width="2.2" stroke-linecap="round">
          <path class="vein" style="--d:2.2s"  pathLength="1" d="M 182 56 C 174 44 168 26 163 10"/>
          <path class="vein" style="--d:2.35s" pathLength="1" d="M 196 58 C 206 44 220 26 234 12"/>
        </g>

        <!-- varredura de luz -->
        <g mask="url(#markMask)">
          <rect class="sheen-bar" x="-60" y="-20" width="64" height="300" fill="url(#gSheen)"/>
        </g>
      </svg>

      <div class="word" aria-hidden="true">
        <span style="--i:0">A</span><span style="--i:1">G</span><span style="--i:2">R</span><span style="--i:3">O</span><span class="gap"></span><span style="--i:4">B</span><span style="--i:5">R</span><span style="--i:6">A</span><span style="--i:7">S</span>
      </div>

      <div class="divider" aria-hidden="true">
        <div class="line"></div>
        <svg width="14" height="16" viewBox="0 0 14 16"><path fill="#2E7D32" d="M 7 15 C 2 12 0 7 2 1 C 9 3 12 9 7 15 Z"/></svg>
        <div class="line"></div>
      </div>
    </div>
  </div>
</div>

<button class="replay" type="button" onclick="replay()">↻ &nbsp;REVER</button>

<script>
'use strict';
/* particulas douradas sutis */
var cv=document.getElementById('dust'),cx=cv.getContext('2d'),P=[],T0=Date.now(),DPR=Math.min(2,window.devicePixelRatio||1);
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'}
size();addEventListener('resize',size);
function mk(){
  return{x:Math.random()*innerWidth,y:innerHeight*(0.25+Math.random()*0.85),
    r:.7+Math.random()*1.8,vy:.06+Math.random()*.22,ph:Math.random()*6.28,
    g:Math.random()<.25,a:.25+Math.random()*.5};
}
for(var i=0;i<38;i++)P.push(mk());
function tick(){
  if(reduced)return;
  var t=(Date.now()-T0)/1000,fade=Math.min(1,t/2.2);
  cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=0;i<P.length;i++){
    var p=P[i];p.y-=p.vy;p.x+=Math.sin(t*.6+p.ph)*.12;
    if(p.y<-8){P[i]=mk();P[i].y=innerHeight+8;continue}
    var tw=.55+.45*Math.sin(t*1.4+p.ph);
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);
    cx.fillStyle=(p.g?'rgba(76,140,74,':'rgba(201,150,40,')+(p.a*tw*fade)+')';
    cx.shadowColor=p.g?'rgba(76,140,74,.7)':'rgba(222,170,60,.8)';
    cx.shadowBlur=6;cx.fill();cx.shadowBlur=0;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function replay(){
  var sc=document.getElementById('scene');
  sc.replaceWith(sc.cloneNode(true));
  var b=document.querySelector('.replay');
  b.replaceWith(b.cloneNode(true));
  document.querySelector('.replay').onclick=replay;
  T0=Date.now();
}
</script>
</body>
</html>
